{{ define "main" }}
  {{ .Content }}
  <button class="poem-scroll-down" aria-label="Descendre d'une page"></button>
  <div class="poem-list">
    {{ range .Site.RegularPages }}
      <a href="{{ .RelPermalink }}">
        <span class="poem-list-title">{{ .Title }}</span> <span style="font-size:1.1em;vertical-align:middle;">&bull;</span> <strong>{{ .Params.author }}</strong> 
      </a>
    {{ end }}
  </div>
{{ end }}
